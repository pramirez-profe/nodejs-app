# Base de datos MySQL (educativo: sin persistencia, los datos se pierden si el pod se reinicia)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql
  namespace: nodejs-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: nodejs-app
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      serviceAccountName: mysql
      containers:
        - name: mysql
          image: mysql:8
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "true"
            - name: MYSQL_DATABASE
              value: nodejs-app
            - name: MYSQL_USER
              value: node
            - name: MYSQL_PASSWORD
              value: node
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -unode -pnode"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: nodejs-app
  labels:
    app: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: tcp-mysql 
      port: 3306
      targetPort: 3306
