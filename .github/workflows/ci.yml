name: Node.js CI con cobertura (Jest + Istanbul)

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
      - name: Run Snyk monitor to take and send snapshot
        uses: snyk/actions/node@master
        with:
          command: monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Install dependencies (instalación reproducible)
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload HTML coverage report
        if: always() && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.node-version }}
          path: reports/junit.xml
          retention-days: 7

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && matrix.node-version == '22.x'
        uses: MishaKav/jest-coverage-comment@main
        with:
          coverage-summary-path: ./coverage/coverage-summary.json
          title: Reporte de cobertura Jest
          summary-title: Resumen
          badge-title: Cobertura
          junitxml-path: ./reports/junit.xml

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Autenticarse con GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build Docker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          #aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Enviar compose a instancia
        run: |
          FILE_BASE64=$(base64 -w 0 docker-compose.yml)
          REMOTE_PATH="/home/ssm-user/docker-compose.yml"
          
          aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Copiando docker-compose al servidor" \
            --parameters "{\"commands\":[\"echo '$FILE_BASE64' | base64 -d > $REMOTE_PATH\"]}"
      - name: Instalar docker y ejecutar compose
        id: ssm-command
        env:
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          # Codifica el script con los comandos al formato JSON que requiere SSM
          jq -n --rawfile script scripts/install-deploy.sh '{commands: [$script]}' > params.json

          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.run_id }}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "command-id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Comando enviado: $CMD_ID"

          # Esperar y luego ejecutar comando que espera que el script finalize
          sleep 5
          aws ssm wait command-executed \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          # Obtener resultado de la ejecucion del script y lo almacena en un archivo JSON
          aws ssm get-command-invocation \
            --region "$AWS_REGION" --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            > invocation.json

          # Extrae informacion del archivo JSON
          STATUS=$(jq -r '.Status' invocation.json)
          echo "----- STDOUT -----"; jq -r '.StandardOutputContent' invocation.json
          echo "----- STDERR -----"; jq -r '.StandardErrorContent' invocation.json
          echo "Estado final: $STATUS"

          [ "$STATUS" = "Success" ] || exit 1
