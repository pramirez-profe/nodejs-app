name: Node.js CI con cobertura (Jest + Istanbul)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + cobertura
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (instalación reproducible)
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:ci

      - name: Upload HTML coverage report
        if: always() && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.node-version }}
          path: reports/junit.xml
          retention-days: 7

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && matrix.node-version == '22.x'
        uses: MishaKav/jest-coverage-comment@main
        with:
          coverage-summary-path: ./coverage/coverage-summary.json
          title: Reporte de cobertura Jest
          summary-title: Resumen
          badge-title: Cobertura
          junitxml-path: ./reports/junit.xml
