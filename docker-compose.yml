services:
  node-app:
    #image: nodejs-app:latest
    image: ghcr.io/pramirez-profe/nodejs-app:latest
    ports:
      - 3000:3000
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "1.0"
  mysql:
    image: mysql:8
    ports:
      - 3306:3306
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: true
      MYSQL_DATABASE: nodejs-app
      MYSQL_USER: node
      MYSQL_PASSWORD: node
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
      interval: 10s 
      retries: 3 
      timeout: 5s 
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
